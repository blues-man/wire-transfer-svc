apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-push-to-main
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: image
      value: "{{ image-registry }}/{{ image-name }}:{{ revision }}"
    - name: tpa-url
      value: "{{ tpa-url }}"
    - name: issuer-url
      value: "{{ issuer-url }}"
    - name: tpa-internal-url
      value: "{{ tpa-internal-url }}"
    - name: maven-mirror-url
      value: "{{ maven-mirror-url }}"
  pipelineSpec:
    params:
      - name: repo-url
      - name: revision
      - name: image
      - name: tpa-url
      - name: issuer-url
      - name: tpa-internal-url
      - name: maven-mirror-url
    tasks:
      - name: fetch-source
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: git-clone }
            - { name: namespace, value: openshift-pipelines }
        workspaces:
          - { name: output, workspace: source }
          - { name: basic-auth, workspace: git-credentials }
        params:
          - { name: URL, value: "$(params.repo-url)" }
          - { name: REVISION, value: "$(params.revision)" }
      - name: maven-build
        runAfter: [fetch-source]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: maven }
            - { name: namespace, value: openshift-pipelines }
        workspaces:
          - { name: source, workspace: source }
          - { name: maven_settings, workspace: maven-settings }
        params:
          - { name: GOALS, value: ["package", "-DskipTests"] }
          - { name: MAVEN_MIRROR_URL, value: "$(params.maven-mirror-url)" }
      - name: build-image
        runAfter: [maven-build]
        taskRef:
          resolver: cluster
          params:
            - { name: kind, value: task }
            - { name: name, value: buildah }
            - { name: namespace, value: openshift-pipelines }
        workspaces:
          - { name: source, workspace: source }
          - { name: dockerconfig, workspace: docker-credentials }
        params:
          - name: IMAGE
            value: "$(params.image)"
          - name: DOCKERFILE
            value: Containerfile
          - name: TLS_VERIFY
            value: "false"
          - name: STORAGE_DRIVER
            value: vfs
          - name: BUILD_EXTRA_ARGS
            value: >-
              --label org.opencontainers.image.source=$(params.repo-url)
              --label org.opencontainers.image.revision=$(params.revision)
      - name: generate-upload-sbom
        runAfter: [build-image]
        taskSpec:
          params:
            - { name: IMAGE }
            - { name: SOURCE_NAME }
            - { name: SOURCE_VERSION }
            - { name: TPA_URL }
            - { name: TPA_INTERNAL_URL }
            - { name: ISSUER_URL }
          volumes:
            - { name: sbom-output, emptyDir: {} }
          steps:
            - name: generate-sbom
              image: registry.access.redhat.com/ubi9-minimal:latest
              volumeMounts:
                - { name: sbom-output, mountPath: /tmp/sbom }
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                echo "Installing prerequisites..."
                microdnf install -y tar gzip --nodocs && microdnf clean all
                echo "Installing syft..."
                curl -sSfL https://get.anchore.io/syft | sh -s -- -b /tmp/bin
                export PATH="/tmp/bin:${PATH}"
                unset SSL_CERT_DIR
                echo "Generating SBOM for $(params.IMAGE)..."
                syft "registry:$(params.IMAGE)" \
                  --source-name "$(params.SOURCE_NAME)" \
                  --source-version "$(params.SOURCE_VERSION)" \
                  --scope deep-squashed \
                  --enrich java \
                  --select-catalogers "+java-archive-cataloger" \
                  -o "cyclonedx-json@1.6=/tmp/sbom/sbom-cyclonedx.json"
                echo "SBOM generated."
            - name: verify-sbom
              image: registry.access.redhat.com/ubi9:latest
              volumeMounts:
                - { name: sbom-output, mountPath: /tmp/sbom }
              script: |
                #!/usr/bin/env bash
                SBOM_FILE="/tmp/sbom/sbom-cyclonedx.json"
                if [ ! -f "${SBOM_FILE}" ]; then
                  echo "ERROR: SBOM file not found" >&2
                  exit 1
                fi
                python3 -c "
                import json
                with open('${SBOM_FILE}') as f:
                    sbom = json.load(f)
                meta = sbom.get('metadata', {})
                component = meta.get('component', {})
                components = sbom.get('components', [])
                licenses_count = sum(1 for c in components if c.get('licenses'))
                print('SBOM Summary:')
                print(f'  CycloneDX version: {sbom.get(\"specVersion\", \"unknown\")}')
                print(f'  Source: {component.get(\"name\", \"N/A\")} v{component.get(\"version\", \"N/A\")}')
                print(f'  Components: {len(components)}')
                print(f'  With license info: {licenses_count}')
                "
            - name: upload-sbom
              image: registry.access.redhat.com/ubi9-minimal:latest
              volumeMounts:
                - { name: sbom-output, mountPath: /tmp/sbom }
              env:
                - name: CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: oidc-cli
                      key: client-secret
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                SBOM_FILE="/tmp/sbom/sbom-cyclonedx.json"
                echo "Obtaining OIDC access token..."
                TOKEN=$(curl -sk -X POST "$(params.ISSUER_URL)/protocol/openid-connect/token" \
                  -H "Content-Type: application/x-www-form-urlencoded" \
                  -d "grant_type=client_credentials" \
                  -d "client_id=tpa-cli" \
                  -d "client_secret=${CLIENT_SECRET}" \
                  | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
                if [ -z "${TOKEN}" ]; then
                  echo "ERROR: Failed to obtain access token" >&2
                  exit 1
                fi
                echo "Access token obtained."
                echo "Uploading SBOM to TPA (internal)..."
                HTTP_CODE=$(curl -sk -X POST \
                  "$(params.TPA_INTERNAL_URL)/api/v3/sbom" \
                  -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data-binary "@${SBOM_FILE}" \
                  -o /tmp/tpa-response.json \
                  -w "%{http_code}")
                echo "TPA response: HTTP ${HTTP_CODE}"
                cat /tmp/tpa-response.json 2>/dev/null
                echo ""
                if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
                  echo "SBOM uploaded successfully."
                elif [ "${HTTP_CODE}" = "504" ] || [ -z "${HTTP_CODE}" ] || [ "${HTTP_CODE}" = "000" ]; then
                  echo "Route timed out — upload likely completed."
                  echo "The server continues processing in the background."
                else
                  echo "ERROR: SBOM upload failed with HTTP ${HTTP_CODE}" >&2
                  exit 1
                fi
        params:
          - { name: IMAGE, value: "$(params.image)" }
          - { name: SOURCE_NAME, value: "{{ repo_name }}" }
          - { name: SOURCE_VERSION, value: "$(params.revision)" }
          - { name: TPA_URL, value: "$(params.tpa-url)" }
          - { name: TPA_INTERNAL_URL, value: "$(params.tpa-internal-url)" }
          - { name: ISSUER_URL, value: "$(params.issuer-url)" }
    workspaces:
      - name: source
      - name: git-credentials
      - name: maven-settings
      - name: docker-credentials
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
    - name: git-credentials
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: maven-settings
      emptyDir: {}
    - name: docker-credentials
      secret:
        secretName: nexus-push-credentials
